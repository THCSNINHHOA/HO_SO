<!-- ============================================================
     HEADER

<header>
    <div class="header-container">
        <div class="sub-title">
            <span>🏛️</span> UBND Phường Ninh Hòa
        </div>
        <div class="school-name">Trường THCS Ninh Hòa</div>
        <div class="main-title">Thống kê tiến độ cập nhật kế hoạch bài dạy</div>
        <div class="week-badge">
            <span>📅</span>
            <span class="week-text" id="current-week">Đang tải...</span>
        </div>
        <div class="check-date" id="check-date">
            Ngày kiểm tra: đang cập nhật...
        </div>
    </div>
</header>

<!-- ============================================================
     CONTROL PANEL
============================================================ -->
<div class="control-panel">
    <div class="control-row">
        <input type="text" id="folderId" placeholder="Nhập Folder ID...">
        <button onclick="loadDrive()">🔄 Tải dữ liệu</button>

     SEARCH

    <input type="text" id="search" placeholder="🔍 Tìm kiếm file hoặc thư mục..." oninput="searchTree()">
</div>

     TREE CONTAINER
============================================================ -->
<div id="tree" class="tree-container">
    <div class="loading">Chưa có dữ liệu.</div>
</div>

<!-- ============================================================
     HELP
============================================================ -->
<div class="help">
    💡 Nhấn vào <b>▶</b> để mở thư mục. Nhấn <b>▼</b> để đóng thư mục. Số bên phải là tổng số file trong thư mục, bao gồm cả file trong các thư mục con.
</div>

<!-- ============================================================
     JAVASCRIPT TỐI ƯU HÓA TỐC ĐỘ (>1000 MỤC)
============================================================ -->
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwe_lBA1A7je-mY1Jp4ElDrZ6VRbaef-nbdr02QAGXc0Wn-uBxvu0YhvZ5NDkqg_4yY8A/exec";
const FOLDER_ID = "1bpq1JJb-aExIb0WrEss8TtAr9xHxa1gg";
let driveData = null;
const loadedFolders = new Map();
const loadingFolders = new Set();

window.onload = function() {
    document.getElementById("folderId").value = FOLDER_ID;
    fetchWithTimeout(WEB_APP_URL + "?warmup=true", 15000).catch(() => {});
    loadDrive();
};

const API_TIMEOUT_MS = 45000;
const MAX_RETRIES = 4;
const RETRY_DELAYS = [1000, 2000, 4000, 8000];
const activeRequests = new Map();

function setConnectionStatus(message, type = "info") {
    const el = document.getElementById("connectionStatus");
    if (!el) return;
    el.className = "connection-status show " + type;
    el.innerHTML = message;
}

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
        const response = await fetch(url, { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response;
    } catch (error) {
        if (error && error.name === "AbortError") throw new Error("Timeout sau " + Math.round(timeoutMs / 1000) + " giây.");
        throw error;
    } finally { clearTimeout(timer); }
}

async function api(folderId, mode) {
    const key = mode + ":" + folderId;
    if (activeRequests.has(key)) return activeRequests.get(key);
    const promise = (async () => {
        const url = `${WEB_APP_URL}?folderId=${encodeURIComponent(folderId)}&mode=${encodeURIComponent(mode)}`;
        let lastError = null;
        for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
            try {
                if (attempt > 1) {
                    setConnectionStatus(`🔄 Kết nối không ổn định. Đang thử lại lần ${attempt}/${MAX_RETRIES}...`, "warning");
                    await sleep(RETRY_DELAYS[attempt - 2] || 8000);
                } else setConnectionStatus("⏳ Đang kết nối Google Drive...", "info");
                const response = await fetchWithTimeout(url, API_TIMEOUT_MS);
                const result = await response.json();
                if (!result || result.success !== true) throw new Error((result && result.error) || "Dữ liệu trả về không hợp lệ.");
                setConnectionStatus("🟢 Google Drive đã kết nối.", "success");
                setTimeout(() => { const el=document.getElementById("connectionStatus"); if(el&&el.classList.contains("success")){el.className="connection-status";el.innerHTML="";} },1800);
                return result.data;
            } catch (error) { lastError = error; }
        }
        throw lastError || new Error("Không thể kết nối Google Drive.");
    })();
    activeRequests.set(key, promise);
    try { return await promise; } finally { activeRequests.delete(key); }
}

async function loadDrive() {
    const folderId = document.getElementById("folderId").value.trim();
    if (!folderId) {
        showError("Bạn chưa nhập Folder ID.");
        return;
    }

    driveData = null;
    loadedFolders.clear();
    loadingFolders.clear();

    setConnectionStatus("⏳ Đang phân tích cấu trúc thư mục...", "info");
    document.getElementById("tree").innerHTML = '<div class="loading">⏳ Đang kiểm tra cấu trúc thư mục...</div>';

    try {
        // Lấy cấp 1 + các thư mục con trực tiếp của cấp 1 để phân biệt:
        // 1) Cấp 1 là giáo viên
        // 2) Cấp 1 là môn học, cấp 2 là giáo viên
        driveData = await api(folderId, "structure");
        renderTopLevel();
        setConnectionStatus("🟢 Đã tải cấu trúc. Chọn thư mục để xem toàn bộ cây bên trong.", "success");
    } catch (error) {
        showError("Lỗi kết nối: " + error.message);
    }
}

function renderTopLevel() {
    const tree = document.getElementById("tree");
    const items = (driveData && driveData.children) || [];

    if (!items.length) {
        tree.innerHTML = '<div class="loading">Không tìm thấy thư mục.</div>';
        return;
    }

    tree.innerHTML = items.map(createTopLevelRow).join("");
}

function createTopLevelRow(folder) {
    const childrenId = "top_children_" + createSafeId(folder.id);
    const hasDirectFolders = Array.isArray(folder.children) && folder.children.length > 0;

    // Nếu cấp 1 có các thư mục con trực tiếp, coi các thư mục con này là
    // ứng viên giáo viên (mô hình Môn học -> Giáo viên).
    // Nếu không có thư mục con trực tiếp, cấp 1 được xem là giáo viên.
    const label = hasDirectFolders ? "📚 Môn học / Nhóm" : "👤 Giáo viên";

    return `
        <div class="tree-item top-item" data-folder-id="${escapeAttribute(folder.id)}">
            <div class="tree-row root-row" data-name="${escapeAttribute(folder.name)}" data-type="folder">
                <div class="toggle" onclick="handleTopLevel(event, '${escapeJs(folder.id)}', '${escapeJs(childrenId)}', this)">▶</div>
                <div class="item-icon">📁</div>
                <div class="name-column">
                    <div class="item-name folder-name">
                        <a href="${escapeAttribute(folder.url || "#")}" target="_blank" onclick="loadFullFolder(event, '${escapeJs(folder.id)}', '${escapeJs(childrenId)}', this.closest('.tree-row').querySelector('.toggle'))">${escapeHtml(folder.name)}</a>
                    </div>
                </div>
                <div class="file-count-column"><span class="file-count zero">${hasDirectFolders ? folder.children.length + " thư mục" : "Chưa tải"}</span></div>
                <div class="type-column">${label}</div>
                <div class="open-column">
                    <a class="open-drive" href="${escapeAttribute(folder.url || "#")}" target="_blank" onclick="event.stopPropagation()">Mở ↗</a>
                </div>
            </div>
            <div id="${childrenId}" class="children"></div>
        </div>
    `;
}

async function handleTopLevel(event, folderId, childrenId, button) {
    event.stopPropagation();
    const item = (driveData.children || []).find(x => x.id === folderId);
    if (!item) return;

    const container = document.getElementById(childrenId);
    if (!container) return;

    const hasDirectFolders = Array.isArray(item.children) && item.children.length > 0;

    // Cấp 1 có thư mục con: mô hình Môn học -> Giáo viên.
    // Hiển thị giáo viên cấp 2. Khi bấm giáo viên, tải toàn bộ cây của giáo viên.
    if (hasDirectFolders) {
        const isOpen = container.classList.contains("open");
        if (isOpen) {
            container.classList.remove("open");
            button.innerHTML = "▶";
            return;
        }

        container.innerHTML = (item.children || []).map(teacher => createTeacherCandidateRow(teacher, 1)).join("");
        container.classList.add("open");
        button.innerHTML = "▼";
        setConnectionStatus("🟢 Đã hiện danh sách giáo viên trong " + escapeHtml(item.name) + ". Chọn giáo viên để tải toàn bộ cây.", "success");
        return;
    }

    // Cấp 1 không có thư mục con trực tiếp: đây là giáo viên.
    await loadFullFolder(event, folderId, childrenId, button);
}

function createTeacherCandidateRow(folder, level) {
    const childrenId = "teacher_children_" + createSafeId(folder.id) + "_" + Math.random().toString(36).slice(2);
    const indent = level * 20;

    return `
        <div class="tree-item teacher-item">
            <div class="tree-row" data-name="${escapeAttribute(folder.name)}" data-type="folder" style="padding-left:${indent}px;">
                <div class="toggle" onclick="loadFullFolder(event, '${escapeJs(folder.id)}', '${escapeJs(childrenId)}', this)">▶</div>
                <div class="item-icon">👤</div>
                <div class="name-column">
                    <div class="item-name folder-name">
                        <a href="${escapeAttribute(folder.url || "#")}" target="_blank" onclick="loadFullFolder(event, '${escapeJs(folder.id)}', '${escapeJs(childrenId)}', this.closest('.tree-row').querySelector('.toggle'))">${escapeHtml(folder.name)}</a>
                    </div>
                </div>
                <div class="file-count-column"><span class="file-count zero">Chưa tải</span></div>
                <div class="type-column">Giáo viên</div>
                <div class="open-column">
                    <a class="open-drive" href="${escapeAttribute(folder.url || "#")}" target="_blank" onclick="event.stopPropagation()">Mở ↗</a>
                </div>
            </div>
            <div id="${childrenId}" class="children"></div>
        </div>
    `;
}

async function loadFullFolder(event, folderId, childrenId, button) {
    if (event) event.stopPropagation();
    const container = document.getElementById(childrenId);
    if (!container) return;
    if (loadedFolders.has(folderId)) {
        const isOpen = container.classList.contains("open");
        container.classList.toggle("open", !isOpen);
        button.innerHTML = isOpen ? "▶" : "▼";
        return;
    }
    if (loadingFolders.has(folderId)) return;
    loadingFolders.add(folderId);
    button.innerHTML = "⏳";
    container.innerHTML = '<div class="loading">⏳ Đang tải toàn bộ cây thư mục...</div>';
    container.classList.add("open");
    setConnectionStatus("⏳ Đang tải toàn bộ thư mục giáo viên...", "info");
    try {
        // Giữ nguyên: một request FULL lấy toàn bộ cây giáo viên.
        const data = await api(folderId, "full");
        loadedFolders.set(folderId, data);
        container.innerHTML = (data.children || []).map(item => item.type === "folder" ? createFolderHTML(item, 1) : createFileHTML(item, 1)).join("");
        container.classList.add("open");
        openAllInside(container);
        button.innerHTML = "▼";
        setConnectionStatus("🟢 Đã tải toàn bộ cây thư mục của " + escapeHtml(data.name || "giáo viên") + ".", "success");
    } catch (error) {
        container.classList.add("open");
        container.innerHTML = `<div class="retry-box">❌ Không tải được thư mục.<br><small>${escapeHtml(error.message || "Lỗi kết nối Google Drive.")}</small><br><button class="gray" onclick="retryLoadFolder(event, '${escapeJs(folderId)}', '${escapeJs(childrenId)}', this)">🔄 Thử lại</button></div>`;
        button.innerHTML = "▶";
        setConnectionStatus("🔴 Không thể tải thư mục sau " + MAX_RETRIES + " lần thử. Bạn có thể bấm Thử lại.", "error");
    } finally { loadingFolders.delete(folderId); }
}

async function retryLoadFolder(event, folderId, childrenId, retryButton) {
    if (event) event.stopPropagation();
    loadedFolders.delete(folderId);
    const container = document.getElementById(childrenId);
    const button = container && container.previousElementSibling ? container.previousElementSibling.querySelector(".toggle") : retryButton;
    await loadFullFolder(event, folderId, childrenId, button);
}

function createFolderHTML(folder, level) {
    const indent = level * 20;
    const childrenId = "children_" + createSafeId(folder.id) + "_" + Math.random().toString(36).slice(2);
    const hasChildren = folder.children && folder.children.length > 0;

    let html = `<div class="tree-item">`;
    html += `<div class="tree-row" data-name="${escapeAttribute(folder.name)}" data-type="folder" style="padding-left:${indent}px;">`;
    html += hasChildren
        ? `<div class="toggle" onclick="toggleFolder('${escapeJs(childrenId)}', this)">▶</div>`
        : `<div class="toggle empty"></div>`;
    html += `<div class="item-icon">📁</div>`;
    html += `<div class="name-column"><div class="item-name folder-name"><a href="${escapeAttribute(folder.url || "#")}" target="_blank">${escapeHtml(folder.name)}</a></div></div>`;
    html += `<div class="file-count-column">${createFileCountHTML(folder.fileCount)}</div>`;
    html += `<div class="type-column">Thư mục</div>`;
    html += `<div class="open-column"><a class="open-drive" href="${escapeAttribute(folder.url || "#")}" target="_blank">Mở ↗</a></div>`;
    html += `</div>`;
    if (hasChildren) {
        html += `<div id="${childrenId}" class="children">`;
        html += folder.children.map(item => item.type === "folder" ? createFolderHTML(item, level + 1) : createFileHTML(item, level + 1)).join("");
        html += `</div>`;
    }
    html += `</div>`;
    return html;
}

function createFileHTML(file, level) {
    const indent = level * 20;
    return `<div class="tree-item"><div class="tree-row" data-name="${escapeAttribute(file.name)}" data-type="file" style="padding-left:${indent}px;"><div class="toggle empty"></div><div class="item-icon">${getFileIcon(file.mimeType)}</div><div class="name-column"><div class="item-name file-name"><a href="${escapeAttribute(file.url || "#")}" target="_blank">${escapeHtml(file.name)}</a></div></div><div class="file-count-column"></div><div class="type-column">${getFileType(file.mimeType)}</div><div class="open-column"><a class="open-drive" href="${escapeAttribute(file.url || "#")}" target="_blank">Mở ↗</a></div></div></div>`;
}

function createFileCountHTML(count) {
    count = Number(count) || 0;
    return count === 0 ? '<span class="file-count zero">0 file</span>' : `<span class="file-count">${count} file</span>`;
}
function getFileIcon(mimeType) {
    if (!mimeType) return "📄";
    if (mimeType.includes("pdf")) return "📕";
    if (mimeType.includes("spreadsheet") || mimeType.includes("excel")) return "📊";
    if (mimeType.includes("document") || mimeType.includes("word")) return "📝";
    if (mimeType.includes("presentation")) return "📽️";
    if (mimeType.includes("image")) return "🖼️";
    if (mimeType.includes("video")) return "🎬";
    if (mimeType.includes("audio")) return "🎵";
    return "📄";
}
function getFileType(mimeType) {
    if (!mimeType) return "Tập tin";
    if (mimeType.includes("pdf")) return "PDF";
    if (mimeType.includes("spreadsheet") || mimeType.includes("excel")) return "Excel";
    if (mimeType.includes("document") || mimeType.includes("word")) return "Word";
    if (mimeType.includes("presentation")) return "PowerPoint";
    if (mimeType.includes("image")) return "Hình ảnh";
    return "Tập tin";
}
function toggleFolder(childrenId, button) {
    const element = document.getElementById(childrenId);
    if (!element) return;
    const isOpen = element.classList.contains("open");
    element.classList.toggle("open", !isOpen);
    button.innerHTML = isOpen ? "▶" : "▼";
}

// Mở toàn bộ các nhánh bên trong một giáo viên cùng lúc.
function openAllInside(container) {
    if (!container) return;
    container.querySelectorAll(".children").forEach(el => el.classList.add("open"));
    container.querySelectorAll(".toggle:not(.empty)").forEach(el => {
        if (el.innerHTML !== "⏳") el.innerHTML = "▼";
    });
}
function openAll() {
    document.querySelectorAll(".children").forEach(el => el.classList.add("open"));
    document.querySelectorAll(".toggle:not(.empty)").forEach(el => { if (el.innerHTML !== "⏳") el.innerHTML = "▼"; });
}
function closeAll() {
    document.querySelectorAll(".children").forEach(el => el.classList.remove("open"));
    document.querySelectorAll(".toggle:not(.empty)").forEach(el => { if (el.innerHTML !== "⏳") el.innerHTML = "▶"; });
}
let searchTimeout;
function searchTree() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        const keyword = document.getElementById("search").value.toLowerCase().trim();
        const rows = document.querySelectorAll(".tree-row");
        if (!keyword) { rows.forEach(row => row.style.display = ""); return; }
        rows.forEach(row => {
            const name = (row.dataset.name || "").toLowerCase();
            if (name.includes(keyword)) {
                row.style.display = "flex";
                let parent = row.parentElement;
                while (parent) {
                    if (parent.classList && parent.classList.contains("children")) {
                        parent.classList.add("open");
                        const prev = parent.previousElementSibling;
                        if (prev) { const toggle = prev.querySelector(".toggle"); if (toggle) toggle.innerHTML = "▼"; }
                    }
                    parent = parent.parentElement;
                }
            } else row.style.display = "none";
        });
    }, 300);
}
function showError(message) {
    document.getElementById("status").innerHTML = `<div class="error">❌ ${escapeHtml(message)}</div>`;
    document.getElementById("tree").innerHTML = "";
}
function createSafeId(text) { return String(text).replace(/[^a-zA-Z0-9_-]/g, "_"); }
function escapeHtml(text) { if (text === null || text === undefined) return ""; return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
function escapeAttribute(text) { return escapeHtml(text); }
function escapeJs(text) { return String(text).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r/g,"\\r").replace(/\n/g,"\\n"); }
</script>
